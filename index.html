<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Конспект пари</title>
  <meta name="description" content="Транскрипції пар у Teams українською: таймкоди, пошук, позначки й конспект.">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Конспект">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/jszip.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="hdr">
    <button class="icon-btn" id="hdr-back" aria-label="Назад" hidden>←</button>
    <span class="hdr-title" id="hdr-title">Конспект пари</span>
    <span class="hdr-actions" id="hdr-actions"></span>
  </header>

  <main id="main" class="main">
    <noscript>Для роботи застосунку потрібен JavaScript.</noscript>
  </main>

  <div class="player" id="player" hidden>
    <button class="icon-btn" id="player-back" aria-label="Назад на 15 секунд">−15</button>
    <button class="icon-btn play" id="player-toggle" aria-label="Відтворити">▶</button>
    <button class="icon-btn" id="player-fwd" aria-label="Вперед на 15 секунд">+15</button>
    <span class="player-time" id="player-time">00:00:00</span>
    <button class="icon-btn" id="player-close" aria-label="Закрити плеєр">✕</button>
  </div>
</body>
</html>
